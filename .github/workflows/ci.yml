name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the release target, so it is a first-class CI runner here,
        # not an afterthought.
        os: [windows-latest, ubuntu-latest]
        python: ["3.13"]
        include:
          - os: windows-latest
            python: "3.11"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install ffmpeg and Skia's runtime deps (Linux)
        if: runner.os == 'Linux'
        # skia-python links against libEGL, which a headless runner does not
        # ship. Windows and macOS wheels are self-contained.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libfontconfig1

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Smoke-test the CLI
        run: |
          uv run kifungu --version
          uv run kifungu shots
          uv run kifungu templates
